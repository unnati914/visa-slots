<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{--ink:#1b1d21;--mute:#6b7079;--line:#e4e4e0;--bg:#fff;--soft:#f5f5f2;--accent:#2457d6;--good:#1a7f4b;--warn:#a15c00}
@media (prefers-color-scheme:dark){:root{--ink:#e9eaee;--mute:#9298a3;--line:#2b2e35;--bg:#1b1d22;--soft:#24272e;--accent:#7aa2ff;--good:#57d18e;--warn:#ffb54d}}
body{width:340px;margin:0;padding:14px;font:13px/1.4 system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
h1{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
label{display:block;color:var(--mute);font-size:12px;margin:8px 0 3px}
input,select{width:100%;box-sizing:border-box;font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.row{display:flex;gap:8px}.row>div{flex:1}
button{font:inherit;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;background:var(--accent);color:#fff}
button.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.actions{display:flex;gap:8px;margin-top:12px}
.status{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.res{display:flex;justify-content:space-between;padding:3px 0}
.res b{font-variant-numeric:tabular-nums}
.ok{color:var(--good)}.prob{color:var(--warn);margin:4px 0}
.mute{color:var(--mute);font-size:12px}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);font-weight:400}
.sw input{width:auto}
</style>
</head>
<body>
<h1>Visa Slot Agent <label class="sw"><input type="checkbox" id="enabled"> On</label></h1>
<div class="row">
  <div><label>Visa type</label><select id="visa"><option>B1/B2</option><option>F1/M1</option><option>J1</option><option>H1B</option><option>L1</option><option>O1</option><option>C1/D</option></select></div>
  <div><label>Appointment</label><select id="cat"><option>Regular</option><option>Dropbox</option></select></div>
</div>
<div class="row">
  <div><label>Country (usvisascheduling.com)</label><input id="country" maxlength="2" placeholder="IN"></div>
  <div><label>Check every (min, 5+)</label><input id="minutes" type="number" min="5" step="1"></div>
</div>
<label>Alert me for any slot before</label><input id="alertBefore" type="date">
<label>Dashboard server</label><input id="server" placeholder="http://localhost:8080">
<div class="actions"><button id="save">Save</button><button id="now" class="ghost">Check now</button></div>
<div class="status" id="status"><span class="mute">No checks yet.</span></div>
<script src="popup.js"></script>
</body>
</html>
