# One always-on machine: the fetcher agent lives inside the server, so it must never sleep
# and must not run as several copies.
app = "visa-slots"
primary_region = "bom"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 8000
    hard_limit = 10000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/api/sources"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
